name: Phase 13 homepage synchronization

on:
  push:
    branches:
      - reengineering/phase-13-authoritative-docs

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reengineering/phase-13-authoritative-docs
          fetch-depth: 0
      - name: Synchronize user-facing Phase 13 content
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_exact(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing expected text: {label}')
              return text.replace(old, new)

          hero_path = Path('components/home/HeroShowcase.tsx')
          hero = hero_path.read_text()
          hero = replace_exact(hero,
              "v5.4.5 · charts · GIFs · video · 22+ filters",
              "v6.0 staged · Node 22/24/26 · charts · GIF · video",
              'hero version')
          hero = replace_exact(hero,
              "for Node.js — render charts, images, GIFs, slides and video on the server with one TypeScript\n            API, powered by Rust under the hood.",
              "for Node.js — render images, charts, GIFs, procedural audio, and FFmpeg-backed video on the server\n            from one TypeScript API. These docs track the staged 6.0 package surface.",
              'hero summary')
          hero = replace_exact(hero,
              "snippet: `await painter.createChart({\n  kind: 'line',\n  series: [revenue, target],\n  area: true, smooth: true,\n  palette: 'sunset',\n  legend: { position: 'top' },\n});`,",
              "snippet: `await painter.createChart(\n  'line',\n  [{\n    label: 'Revenue',\n    data: [{ x: 1, y: 12 }, { x: 2, y: 18 }],\n    color: '#FF3DAA',\n  }],\n  { dimensions: { width: 960, height: 540 } },\n);`,",
              'hero chart snippet')
          hero = replace_exact(hero,
              "snippet: `await painter.createCanvas({ ... });\nawait painter.createText({\n  text: 'Q3 Performance',\n  font: { size: 64, weight: 800 },\n  gradient: emberGradient,\n});\nawait painter.createChart({ ... });`,",
              "snippet: `const canvas = await painter.createCanvas({\n  width: 960, height: 540, colorBg: '#0f172a',\n});\nawait painter.createText(\n  {\n    text: 'Q3 Performance', x: 48, y: 80,\n    font: { size: 64, family: 'Arial' },\n    fill: { color: '#ffffff' },\n  },\n  canvas,\n);`,",
              'hero composition snippet')
          hero = replace_exact(hero,
              "snippet: `await painter.createImage({\n  shapes: prismGeometry,\n  filters: [{ type: 'glow',\n    color: '#FF3DAA', radius: 24 }],\n  paintOrder: 'shape-then-glow',\n});`,",
              "snippet: `const canvas = await painter.createCanvas({\n  width: 960, height: 540, colorBg: '#0f172a',\n});\nawait painter.createImage(\n  {\n    source: 'rectangle', x: 120, y: 100,\n    width: 420, height: 260,\n    shape: { fill: true, color: '#FF3DAA' },\n  },\n  canvas,\n);`,",
              'hero image snippet')
          hero = replace_exact(hero,
              "navigator.clipboard.writeText('npm install apexify.js');",
              "navigator.clipboard.writeText('npm install github:EIAS79/Apexify.js#ce300541b344e9938db5943b30808171bc707d5b');",
              'hero install copy')
          hero = replace_exact(hero,
              'title="Copy install command"',
              'title="Copy staged Apexify.js 6 GitHub install command"',
              'hero install title')
          hero = replace_exact(hero,
              "<span className=\"opacity-70\">$</span> npm i apexify.js",
              "<span className=\"opacity-70\">$</span> npm i github:EIAS79/Apexify.js#ce300541…",
              'hero install label')
          hero_path.write_text(hero)

          home_path = Path('components/home/HomeSections.tsx')
          home = home_path.read_text()
          home = replace_exact(home, "title: 'Programmatic slides',", "title: 'Presentation graphics',", 'bento slides')
          home = replace_exact(home,
              'const SAMPLE_CODE = `import { ApexPainter } from \'apexify.js\';\n\nconst painter = new ApexPainter();\n\nconst { buffer } = await painter.createChart({\n  kind: \'line\',\n  width: 960,\n  height: 540,\n  series: [\n    { name: \'Revenue\', data: revenue, fill: \'gradient\' },\n    { name: \'Target\',  data: target,  dashed: true   },\n  ],\n  smooth: true,\n  palette: \'sunset\',\n  legend: { position: \'top\' },\n  background: { gradient: aurora },\n});\n\nawait fs.promises.writeFile(\'chart.png\', buffer);`;',
              'const SAMPLE_CODE = `import { writeFile } from \'node:fs/promises\';\nimport { ApexPainter } from \'apexify.js\';\n\nconst painter = new ApexPainter({ type: \'buffer\' });\n\nconst buffer = await painter.createChart(\n  \'line\',\n  [{\n    label: \'Revenue\',\n    data: [{ x: 1, y: 12 }, { x: 2, y: 18 }, { x: 3, y: 15 }],\n    color: \'#FF3DAA\',\n  }],\n  { dimensions: { width: 960, height: 540 } },\n);\n\nawait writeFile(\'chart.png\', buffer);`;',
              'home sample code')
          home = replace_exact(home,
              'subtitle="Same TypeScript surface, whether you\'re rendering a chart, a slide, a banner, or a 60-frame GIF."',
              'subtitle="Same TypeScript surface, whether you\'re rendering a chart, a presentation graphic, a banner, or a GIF."',
              'home snippet subtitle')
          home = re.sub(
              r"const BENCH = \[.*?\];\n\nexport function PerformanceSection",
              "const BENCH = [\n  { label: 'Node 22 full release gate', value: 100, color: 'var(--gradient-sunset)', winner: true },\n  { label: 'Node 24 full release gate', value: 100, color: 'var(--accent-iris)' },\n  { label: 'Node 26 full release gate', value: 100, color: 'var(--accent-iris-soft)' },\n  { label: 'Packed ESM / CJS / types', value: 100, color: 'var(--text-muted)' },\n];\n\nexport function PerformanceSection",
              home,
              count=1,
              flags=re.S,
          )
          home = replace_exact(home,
              "TypeScript on the surface.{' '}\n                  <span className=\"text-grad-ember\">Rust underneath.</span>",
              "Measured, bounded, and{' '}\n                  <span className=\"text-grad-ember\">regression-gated.</span>",
              'performance title')
          home = replace_exact(home,
              'subtitle="Built on @napi-rs/canvas — a Rust-native binding that ships memory-efficient pipelines, smart caching, and parallel-safe batch & chain operations for big workloads."',
              'subtitle="Apexify.js combines native raster primitives with bounded caches, runtime resource limits, controlled concurrency, and benchmark gates. Measure performance on the workload you actually deploy."',
              'performance subtitle')
          home = replace_exact(home, 'Rust SIMD', 'Regression benchmarks', 'performance chip')
          home = replace_exact(home, 'Relative throughput', 'Release/runtime verification', 'performance heading')
          home = replace_exact(home, 'higher is better', 'all gates required', 'performance heading note')
          home = replace_exact(home,
              'Numbers are illustrative — measure on your own workload. Apexify gets the lead by composing\n                Rust-backed canvas + image filters + chart layout on a single buffer instead of round-tripping\n                through multiple libraries.',
              'These bars are pass-state indicators, not cross-library speed claims. The release gate runs on\n                Node 22, 24, and 26 and verifies the packed ESM/CommonJS/type surface. Separate repository\n                benchmarks record representative medians and reject material regressions; deployment speed still\n                depends on dimensions, codecs, filters, fonts, concurrency, and host resources.',
              'performance disclaimer')
          home = replace_exact(home,
              'Programmatic visual library for Node.js — charts, images, GIFs, and video, all in one TypeScript\n              surface. Powered by Rust under the hood.',
              'Programmatic visual library for Node.js — images, charts, GIFs, procedural audio, and FFmpeg-backed\n              video through one TypeScript surface.',
              'home footer')
          home_path.write_text(home)

          route_path = Path('app/api/docs/route.ts')
          route = route_path.read_text()
          route = replace_exact(route,
              "  'api-scene',\n  'api-lines-paths',\n  'api-charts',\n  'api-gif',\n  'api-video',",
              "  'api-scene',\n  'api-image',\n  'api-lines-paths',\n  'api-charts',\n  'api-gif',\n  'api-audio',\n  'api-video',",
              'api subgroup order')
          route = replace_exact(route,
              "  'api-scene': 'Canvas & layers',\n  'api-lines-paths': 'Lines & paths',\n  'api-charts': 'Charts',\n  'api-gif': 'GIF & animation',\n  'api-video': 'Video',",
              "  'api-scene': 'Canvas & layers',\n  'api-image': 'Images & utilities',\n  'api-lines-paths': 'Lines & paths',\n  'api-charts': 'Charts',\n  'api-gif': 'GIF & animation',\n  'api-audio': 'Audio',\n  'api-video': 'Video',",
              'api subgroup labels')
          route = replace_exact(route,
              "  'api-scene': [\n    'api-new-apex-painter',\n    'api-create-canvas',\n    'api-create-image',\n    'api-create-text',\n    'api-measure-text',\n  ],\n  'api-lines-paths':",
              "  'api-scene': [\n    'api-new-apex-painter',\n    'api-create-canvas',\n    'api-create-image',\n    'api-create-text',\n    'api-measure-text',\n  ],\n  'api-image': ['api-image-utilities'],\n  'api-lines-paths':",
              'api image file order')
          route = replace_exact(route,
              "  'api-gif': ['api-create-gif', 'api-animate'],\n  'api-video':",
              "  'api-gif': ['api-create-gif', 'api-animate'],\n  'api-audio': ['api-create-audio'],\n  'api-video':",
              'api audio file order')
          route = replace_exact(route,
              "const ADVANCED_ORDER = ['00-advanced-overview'];",
              "const ADVANCED_ORDER = ['00-advanced-overview', '01-runtime-resource-governance', '02-security-deployment', '03-performance-memory', '04-migration-v6'];",
              'advanced order')
          route_path.write_text(route)
          PY
      - name: Commit synchronized content
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Phase 13 homepage/navigation already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/home/HeroShowcase.tsx components/home/HomeSections.tsx app/api/docs/route.ts
          git commit -m "Phase 13: synchronize homepage examples and documentation navigation"
          git push origin HEAD:reengineering/phase-13-authoritative-docs
