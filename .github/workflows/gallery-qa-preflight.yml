name: Gallery QA preflight

on:
  pull_request:
    paths:
      - 'scripts/gallery/qa/**'
      - '.github/workflows/gallery-qa-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run dependency-free gallery QA regression tests
        run: node --test scripts/gallery/qa/verify-assets.test.mjs
