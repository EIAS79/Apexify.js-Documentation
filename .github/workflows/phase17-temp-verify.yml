name: Phase 17 Temporary Verification

on:
  push:
    branches:
      - studio-visual/v17-hardening

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Full production build
        run: npm run build

      - name: Full Visual regression suite
        run: npm run studio:visual:test
