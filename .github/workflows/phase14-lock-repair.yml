name: Phase 14 Lock Repair

on:
  push:
    branches:
      - phase14/final-package-docs-sync
    paths:
      - .github/workflows/phase14-lock-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase14/final-package-docs-sync
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Use HTTPS for public GitHub git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
      - name: Regenerate lockfile without dependency drift
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify restored direct type dependency and final Apexify pin
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const expectedSha = 'c2b8eb01b071c0ddff18f3cd0fef0431e5150981';
          assert.equal(pkg.devDependencies?.['@types/react'], '^18.2.0');
          assert.equal(lock.packages?.['']?.devDependencies?.['@types/react'], '^18.2.0');
          assert.equal(pkg.dependencies?.['apexify.js'], `github:EIAS79/Apexify.js#${expectedSha}`);
          assert.equal(lock.packages?.['']?.dependencies?.['apexify.js'], `github:EIAS79/Apexify.js#${expectedSha}`);
          NODE
      - name: Commit repaired lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'No lockfile changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Phase 14 docs: restore React type lock entry'
          git push origin HEAD:phase14/final-package-docs-sync
