name: Workspace Studio WS-01 Responsive Preview

on:
  pull_request:
    paths:
      - 'app/studio/workspace/**'
      - 'components/studio/workspace/**'
      - 'styles/workspace-studio.css'
      - 'scripts/studio/workspace/ws01-browser-smoke.mjs'
      - '.github/workflows/workspace-studio-ws01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APEX_WORKSPACE_STUDIO_PREVIEW: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned Apexify runtime, Docs and browser dependencies
        run: npm ci --no-audit --no-fund
      - name: Install browser driver
        run: npm install --no-save --package-lock=false --ignore-scripts puppeteer-core@24.16.0
      - name: Production build with gated preview enabled
        run: npm run build
      - name: Start production-like server
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/apexify-ws01-server.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/studio/workspace >/dev/null; then exit 0; fi
            sleep 2
          done
          tail -150 /tmp/apexify-ws01-server.log
          exit 1
      - name: Verify real Studio adapters, drawer/viewport behavior and disabled future features
        env:
          CHROME_PATH: /usr/bin/google-chrome
          STUDIO_WS01_BASE_URL: http://127.0.0.1:3000
          STUDIO_WS01_EVIDENCE: generated/studio/workspace/ws01-browser
        run: node scripts/studio/workspace/ws01-browser-smoke.mjs
      - name: Upload responsive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-studio-ws01-responsive-screenshots
          path: generated/studio/workspace/ws01-browser/
          if-no-files-found: warn
          retention-days: 30
      - name: Server diagnostic
        if: failure()
        run: tail -200 /tmp/apexify-ws01-server.log || true
