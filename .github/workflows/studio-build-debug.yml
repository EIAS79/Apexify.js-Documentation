name: Studio build debug
on:
  push:
    branches:
      - debug/studio-build-module

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies while preserving failed postinstall workspace
        run: npm ci || true
      - name: Re-verify DOC-5 against current Apexify pin
        run: npm run docs:examples:verify
      - name: Rebuild search after verified examples
        run: npm run docs:search:build
      - name: Production build
        run: npm run build
      - name: Emit DOC-5 regenerated artifacts
        if: always()
        run: |
          echo '---PACKAGE-ARTIFACT---'
          cat generated/docs-doc5/package-artifact.json || true
          echo '---OUTPUT-PROVENANCE---'
          cat generated/docs-doc5/output-provenance.json || true
          echo '---VERIFICATION-RESULTS---'
          cat generated/docs-doc5/verification-results.json || true
          echo '---END-DOC5---'
