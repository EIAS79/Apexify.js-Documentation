name: DOC-8 Final Source Repair

on:
  push:
    branches: [doc8-studio-interactive-foundation]
    paths:
      - '.github/workflows/doc8-final-source-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: doc8-studio-interactive-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply exact source repair
        run: node scripts/docs/doc8-final-source-fix.mjs
      - name: Commit repaired source and remove temporary machinery
        shell: bash
        run: |
          git config user.name "Elioo"
          git config user.email "147754375+EIAS79@users.noreply.github.com"
          git rm .github/workflows/doc8-final-source-fix.yml scripts/docs/doc8-final-source-fix.mjs
          git add app/studio/layout.tsx components/studio/StudioTopBar.tsx components/studio/StudioStatusBar.tsx
          git diff --cached --check
          git commit -m "DOC-8: fix final Studio accessibility defects"
          git push origin HEAD:doc8-studio-interactive-foundation
