name: Phase 14 Final Package Pin

on:
  push:
    branches:
      - phase14/final-package-docs-sync
    paths:
      - .github/workflows/phase14-package-pin.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase14/final-package-docs-sync
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Use HTTPS for public GitHub git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
      - name: Pin docs to final Phase 14 package SHA
        env:
          PACKAGE_SHA: c2b8eb01b071c0ddff18f3cd0fef0431e5150981
          OLD_SHA: 4aca4b4c98a50020a1c41b02983d341791a3ddba
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const sha = process.env.PACKAGE_SHA;
          const old = process.env.OLD_SHA;
          pkg.dependencies['apexify.js'] = `github:EIAS79/Apexify.js#${sha}`;
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);

          const heroPath = 'components/home/HeroShowcase.tsx';
          let hero = fs.readFileSync(heroPath, 'utf8');
          if (!hero.includes(old)) throw new Error('Expected previous package SHA not found in HeroShowcase.');
          hero = hero.split(old).join(sha);
          hero = hero.replace('#4aca4b4c…', '#c2b8eb01…');
          fs.writeFileSync(heroPath, hero);
          NODE
      - name: Regenerate lockfile for exact package commit
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify exact package lock
        env:
          PACKAGE_SHA: c2b8eb01b071c0ddff18f3cd0fef0431e5150981
          OLD_SHA: 4aca4b4c98a50020a1c41b02983d341791a3ddba
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const sha = process.env.PACKAGE_SHA;
          const old = process.env.OLD_SHA;
          const pkg = fs.readFileSync('package.json', 'utf8');
          const lock = fs.readFileSync('package-lock.json', 'utf8');
          const hero = fs.readFileSync('components/home/HeroShowcase.tsx', 'utf8');
          assert.ok(pkg.includes(sha), 'package.json does not contain final package SHA');
          assert.ok(lock.includes(sha), 'package-lock.json does not contain final package SHA');
          assert.ok(hero.includes(sha), 'HeroShowcase does not contain final package SHA');
          for (const [name, text] of [['package.json', pkg], ['package-lock.json', lock], ['HeroShowcase.tsx', hero]]) {
            assert.ok(!text.includes(old), `${name} still contains previous package SHA`);
          }
          NODE
      - name: Verify locked install and docs package version
        run: |
          npm ci --ignore-scripts
          node -e "const p=require('./node_modules/apexify.js/package.json'); if(p.version!=='6.0.0') throw new Error('Expected apexify.js 6.0.0, got '+p.version); console.log('apexify.js',p.version)"
      - name: Commit exact package pin
        run: |
          if git diff --quiet -- package.json package-lock.json components/home/HeroShowcase.tsx; then
            echo 'No pin changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json components/home/HeroShowcase.tsx
          git commit -m 'Phase 14 docs: pin final package main SHA'
          git push origin HEAD:phase14/final-package-docs-sync
