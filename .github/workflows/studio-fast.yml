name: Studio Fast

on:
  push:
    branches:
      - 'studio-parity-*'
      - 'studio-visual/**'
    paths:
      - 'app/studio/**'
      - 'app/api/gallery/run/**'
      - 'components/studio/**'
      - 'lib/studio/**'
      - 'scripts/studio/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vercel.json'
      - '.github/workflows/studio-fast.yml'
  workflow_dispatch:

concurrency:
  group: studio-fast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  affected:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout current Studio tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Setup Node matching Vercel
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund

      # The docs repo uses --ignore-scripts for predictable fast CI, but
      # Git-pinned Apexify packages generate their declaration files in prepare.
      # Build declarations from the exact runtime SHA instead of silently
      # skipping the parity typecheck or accepting unresolved public types.
      - name: Checkout pinned runtime types source
        if: startsWith(github.ref_name, 'studio-parity-')
        uses: actions/checkout@v4
        with:
          repository: EIAS79/Apexify.js
          ref: 379a5248f09ed39c1b1734fe104b6bd73a77857f
          path: .studio-runtime-types
          persist-credentials: false

      - name: Prepare runtime declarations for parity typecheck
        if: startsWith(github.ref_name, 'studio-parity-')
        working-directory: .studio-runtime-types
        run: |
          npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
          npm run build:types
          mkdir -p ../node_modules/apexify.js/dist
          cp -R dist/declarations dist/declarations-cjs ../node_modules/apexify.js/dist/
          test -f ../node_modules/apexify.js/dist/declarations/index.d.ts

      - name: Run affected Studio validation
        env:
          STUDIO_CI_BASE_SHA: ${{ github.event.before }}
          STUDIO_CI_HEAD_SHA: ${{ github.sha }}
        run: npm run studio:ci:fast
