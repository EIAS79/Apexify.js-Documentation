name: Temporary Phase 2 Docs Lockfile

on:
  push:
    branches:
      - reengineering/phase-2-runtime-docs
    paths:
      - .github/workflows/phase-2-docs-lock.yml

permissions:
  contents: write

jobs:
  lock-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reengineering/phase-2-runtime-docs
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Regenerate lock metadata
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --check
          git commit -m "chore(runtime): refresh docs lockfile for Node 22" || true
          if ! git diff --quiet HEAD@{1} HEAD 2>/dev/null; then
            git push origin HEAD:reengineering/phase-2-runtime-docs
          fi
      - name: Install locked graph
        run: npm ci
      - name: Build documentation site
        run: npm run build
