name: Temporary Phase 2 Docs Lockfile

on:
  push:
    branches:
      - reengineering/phase-2-runtime-docs
    paths:
      - .github/workflows/phase-2-docs-lock.yml

permissions:
  contents: read

jobs:
  build-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Install locked graph without legacy native postinstall hooks
        run: npm ci --ignore-scripts
      - name: Build documentation site
        run: npm run build
