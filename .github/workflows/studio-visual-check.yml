name: Studio Visual Phase Gate

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: studio-visual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-gate:
    name: Visual Studio phase gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies without runtime-heavy postinstall
        run: npm ci --ignore-scripts

      - name: Install pinned browser runtime snapshot
        run: node scripts/studio/install-apexify-web.mjs

      - name: Install Studio media runtimes
        run: |
          node scripts/studio/install-deno.mjs
          node scripts/studio/install-ffmpeg.mjs

      - name: Generate DOC-4 option inventory
        run: npm run docs:generate:doc4

      - name: Regenerate base Studio capability evidence
        run: npm run studio:completeness

      - name: Upload regenerated base capability evidence
        uses: actions/upload-artifact@v4
        with:
          name: studio-base-capability-matrix
          path: generated/studio/capability-matrix.json
          if-no-files-found: error
          retention-days: 1

      - name: Verify committed base capability evidence
        run: git diff --exit-code -- generated/studio/capability-matrix.json

      - name: Generate Phase 16 completeness report
        continue-on-error: true
        run: npm run studio:visual:phase16

      - name: Upload Phase 16 completeness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-visual-phase16-completeness
          path: |
            generated/studio/phase16-feature-completeness.json
            generated/studio/phase16-feature-completeness.md
          if-no-files-found: error
          retention-days: 1

      - name: Verify Visual Studio contracts
        run: npm run studio:visual:verify

      - name: Phase 13 Linux video smoke
        env:
          STUDIO_DISABLE_PRLIMIT: '1'
        run: npm run studio:smoke:video

      - name: Typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee studio-visual-typecheck.log

      - name: Upload typecheck diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-visual-typecheck-log
          path: studio-visual-typecheck.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Build Studio candidate
        run: npm run build

      - name: Install ephemeral browser audit tool
        run: npm install --no-save --package-lock=false --ignore-scripts puppeteer-core@24.16.0

      - name: Resolve system Chrome
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"

      - name: Start production server
        shell: bash
        run: |
          npm start -- -p 3000 > /tmp/studio-visual-next.log 2>&1 &
          for i in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3000/studio >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/studio-visual-next.log || true
          exit 1

      - name: Dual-mode shell browser regression
        env:
          STUDIO_VISUAL_BASE_URL: http://127.0.0.1:3000
        run: node scripts/studio/visual/visual-shell-browser-smoke.mjs

      - name: Upload PRE-4 shell screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-visual-pre4-screenshot
          path: /tmp/studio-visual-pre4.png
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-visual-next-log
          path: /tmp/studio-visual-next.log
          if-no-files-found: ignore
          retention-days: 1
