name: DOC-2 Design System and Shell

on:
  push:
    branches:
      - doc2-design-system-shell
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify DOC-2 shell
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Deterministic install
        run: npm ci
      - name: Existing documentation integrity
        run: npm run verify:docs
      - name: DOC-1 route regression
        run: npm run docs:verify:doc1
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
