name: Documentation Runtime Build Gate

on:
  push:
    branches:
      - main
      - reengineering/phase-13-authoritative-docs
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }} / Phase 13 docs gate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Install locked documentation graph
        run: npm ci
      - name: Verify documentation/runtime contract and drift guards
        run: npm run verify:docs
      - name: Typecheck documentation application
        run: npm run typecheck
      - name: Build documentation site
        run: npm run build
