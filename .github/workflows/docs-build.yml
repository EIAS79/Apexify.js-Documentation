name: Documentation Runtime Build Gate

on:
  push:
    branches:
      - main
      - reengineering/phase-2-runtime-docs
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Node ${{ matrix.node }} / docs build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Install locked documentation graph
        run: npm ci
      - name: Verify Apexify runtime used by docs tooling
        run: |
          node --input-type=module <<'NODE'
          import {
            ApexPainter,
            ApexifyResourceLimitError,
            configureApexifyRuntime,
            getDefaultApexifyRuntimeConfig,
            resetApexifyRuntimeConfig,
          } from 'apexify.js';

          if (typeof ApexPainter !== 'function') throw new Error('ApexPainter export missing');
          if (typeof configureApexifyRuntime !== 'function') throw new Error('configureApexifyRuntime export missing');
          if (typeof getDefaultApexifyRuntimeConfig !== 'function') throw new Error('getDefaultApexifyRuntimeConfig export missing');
          if (typeof resetApexifyRuntimeConfig !== 'function') throw new Error('resetApexifyRuntimeConfig export missing');

          const defaults = getDefaultApexifyRuntimeConfig();
          if (defaults.limits.maxCanvasDimension !== 16_384) throw new Error('documented maxCanvasDimension default drifted');
          if (defaults.limits.maxBatchConcurrency !== 4) throw new Error('documented maxBatchConcurrency default drifted');

          configureApexifyRuntime({ limits: { maxBatchConcurrency: 2 } });
          if (getDefaultApexifyRuntimeConfig().limits.maxBatchConcurrency !== 2) throw new Error('runtime limit override failed');
          resetApexifyRuntimeConfig();

          const sample = new ApexifyResourceLimitError('maxBatchOperations', 256, 257);
          if (sample.code !== 'APEXIFY_RESOURCE_LIMIT' || sample.limit !== 'maxBatchOperations') {
            throw new Error('documented resource-limit error contract drifted');
          }
          console.log('docs Apexify Phase 4 runtime governance API ok');
          NODE
      - name: Build documentation site
        run: npm run build
