name: Studio Docs Batch Output

on:
  pull_request:
    paths:
      - 'content/docs/03-feature-guides/raster-batch-output/01-batch-and-chain.mdx'
      - 'lib/studio/runtime/isolatedNodeExecutor.ts'
      - 'lib/studio/runtime/wrapStudioSnippetForRunner.ts'
      - 'lib/studio/studioConfig.ts'
      - 'scripts/studio/docs-batch-no-artifact.test.ts'
      - '.github/workflows/studio-docs-batch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch-return-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - name: Check documentation handoff and isolated runtime diagnostics
        run: npx tsx --test scripts/studio/docs-batch-no-artifact.test.ts
