name: Studio Video Runtime Smoke

concurrency:
  group: studio-video-runtime-smoke
  cancel-in-progress: true

on:
  workflow_dispatch:
jobs:
  video-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Run exact Studio video smoke
        env:
          STUDIO_DISABLE_PRLIMIT: '1'
        run: npm run studio:smoke:video
      - name: Upload rendered MP4
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: studio-video-smoke
          path: studio-smoke-output/pulse-bloom.mp4
          if-no-files-found: error
