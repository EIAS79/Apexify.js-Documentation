name: DOC-12 Final Documentation Release Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package_ref:
        description: Exact Apexify.js candidate ref/SHA to validate (defaults to package main)
        required: false
        default: main
        type: string

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  DOC11_BASE_URL: http://127.0.0.1:3000

jobs:
  release-gate:
    name: Complete documentation correctness contract
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout documentation candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1

      - name: Clean deterministic documentation install
        run: npm ci

      - name: Checkout exact Apexify.js candidate
        uses: actions/checkout@v4
        with:
          repository: EIAS79/Apexify.js
          ref: ${{ inputs.package_ref || 'main' }}
          path: _doc12-package-main
          fetch-depth: 0

      - name: Build and pack package candidate
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_DIR="$GITHUB_WORKSPACE/_doc12-package-main"
          PACKAGE_SHA="$(git -C "$PACKAGE_DIR" rev-parse HEAD)"
          PACKAGE_VERSION="$(node -p "require('$PACKAGE_DIR/package.json').version")"
          mkdir -p "$RUNNER_TEMP/doc12-package-artifact"
          pushd "$PACKAGE_DIR"
          npm ci
          npm run build
          PACK_JSON="$(npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/doc12-package-artifact")"
          popd
          PACKAGE_FILE="$(node -e "const x=JSON.parse(process.argv[1]);process.stdout.write(x[0].filename)" "$PACK_JSON")"
          PACKAGE_TARBALL="$RUNNER_TEMP/doc12-package-artifact/$PACKAGE_FILE"
          test -f "$PACKAGE_TARBALL"
          PACKAGE_ARTIFACT_SHA256="$(sha256sum "$PACKAGE_TARBALL" | awk '{print $1}')"
          echo "DOC12_PACKAGE_MAIN_SHA=$PACKAGE_SHA" >> "$GITHUB_ENV"
          echo "DOC12_PACKAGE_MAIN_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "DOC12_PACKAGE_TARBALL=$PACKAGE_TARBALL" >> "$GITHUB_ENV"
          echo "DOC12_PACKAGE_MAIN_ARTIFACT_SHA256=$PACKAGE_ARTIFACT_SHA256" >> "$GITHUB_ENV"
          echo "Package candidate: $PACKAGE_SHA $PACKAGE_VERSION $PACKAGE_ARTIFACT_SHA256"

      - name: Fail fast on package public-surface drift
        run: npm run docs:verify:package-candidate

      - name: Regenerate and verify DOC-1 through DOC-10 prerequisites
        run: npm run docs:verify:doc10

      - name: Typecheck before browser certification
        run: npm run typecheck

      - name: Production build before browser certification
        run: npm run build

      - name: Install ephemeral browser audit tooling
        run: npm install --no-save --package-lock=false --ignore-scripts puppeteer-core@24.16.0 axe-core@4.10.3 lighthouse@12.8.2

      - name: Resolve system Chrome
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version

      - name: Build and start exact documentation comparison base
        shell: bash
        env:
          DOC12_COMPARE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -euo pipefail
          BASE_SHA="$DOC12_COMPARE_SHA"
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "$ZERO_SHA" ]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          BASE_DIR="$RUNNER_TEMP/doc12-base"
          rm -rf "$BASE_DIR"
          git worktree add --detach "$BASE_DIR" "$BASE_SHA"
          pushd "$BASE_DIR"
          npm ci
          npm run build
          npm start -- -p 3001 > /tmp/doc12-base-server.log 2>&1 &
          echo $! > /tmp/doc12-base-server.pid
          popd
          ok=0
          for i in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:3001/docs/getting-started >/dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            cat /tmp/doc12-base-server.log || true
            exit 1
          fi
          echo "DOC11_BUNDLE_BASE_URL=http://127.0.0.1:3001" >> "$GITHUB_ENV"
          echo "DOC11_BUNDLE_BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "DOC12_DOCS_BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"

      - name: Start current production server
        shell: bash
        run: |
          npm start -- -p 3000 > /tmp/doc12-current-server.log 2>&1 &
          echo $! > /tmp/doc12-current-server.pid
          ok=0
          for i in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:3000/docs/getting-started >/dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            cat /tmp/doc12-current-server.log || true
            exit 1
          fi

      - name: Re-run DOC-11 static contracts
        run: node scripts/docs/doc11-static-audit.mjs

      - name: Re-run DOC-11 browser, accessibility, mobile, bundle and reliability audit
        run: node scripts/docs/doc11-browser-verify.mjs

      - name: Re-run DOC-11 reference Lighthouse matrix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .doc11-lighthouse
          mkdir -p .doc11-lighthouse
          routes=(
            "home|/"
            "docs|/docs/getting-started"
            "api|/api-reference"
            "gallery|/gallery"
            "studio|/studio"
            "playground|/docs/node/canvas"
          )
          for entry in "${routes[@]}"; do
            name="${entry%%|*}"
            route="${entry#*|}"
            url="http://127.0.0.1:3000${route}"
            npx lighthouse "$url" --output=json --output-path=".doc11-lighthouse/${name}-mobile.json" --only-categories=performance,accessibility,best-practices,seo --quiet --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"
            npx lighthouse "$url" --preset=desktop --output=json --output-path=".doc11-lighthouse/${name}-desktop.json" --only-categories=performance,accessibility,best-practices,seo --quiet --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"
          done
          node scripts/docs/doc11-lighthouse-summary.mjs

      - name: DOC-12 repeated standard-doc Lighthouse gate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .doc12-lighthouse
          mkdir -p .doc12-lighthouse
          url="http://127.0.0.1:3000/docs/getting-started"
          for i in 1 2 3; do
            npx lighthouse "$url" --output=json --output-path=".doc12-lighthouse/docs-mobile-${i}.json" --only-categories=performance,accessibility,best-practices,seo --quiet --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"
            npx lighthouse "$url" --preset=desktop --output=json --output-path=".doc12-lighthouse/docs-desktop-${i}.json" --only-categories=performance,accessibility,best-practices,seo --quiet --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"
          done

      - name: Verify complete DOC-11 evidence before DOC-12
        run: node scripts/docs/doc11-evidence-verify.mjs

      - name: Stop browser certification servers
        if: always()
        shell: bash
        run: |
          for pidfile in /tmp/doc12-current-server.pid /tmp/doc12-base-server.pid; do
            if [ -f "$pidfile" ]; then kill "$(cat "$pidfile")" 2>/dev/null || true; fi
          done

      - name: Authoritative DOC-12 release verification
        run: npm run docs:verify:release

      - name: Emit release summary
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const read=(p)=>fs.existsSync(p)?JSON.parse(fs.readFileSync(p,'utf8')):null;
          const decision=read('generated/docs-doc12/release-decision.json');
          const score=read('generated/docs-doc12/quality-scorecard.json');
          const identity=read('generated/docs-doc12/identity.json');
          console.log(JSON.stringify({identity,decision,quality:score&&{overall:score.overall,status:score.status}},null,2));
          NODE

      - name: Archive final DOC-12 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-doc12-final-release-evidence
          path: |
            generated/docs-doc12
            generated/verification/doc-11
            .doc11-lighthouse
            .doc12-lighthouse
            /tmp/doc12-current-server.log
            /tmp/doc12-base-server.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 90
