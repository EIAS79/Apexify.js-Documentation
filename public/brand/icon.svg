<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Apexify.js mark</title>
  <desc id="desc">A geometric A-shaped apex mark with cyan, blue and violet gradients and two programmable pixel accents.</desc>
  <defs>
    <linearGradient id="apex" x1="110" y1="410" x2="398" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#055CFF"/>
      <stop offset=".38" stop-color="#1B9DFF"/>
      <stop offset=".66" stop-color="#28DDE9"/>
      <stop offset="1" stop-color="#8A27FF"/>
    </linearGradient>
    <linearGradient id="inner" x1="250" y1="294" x2="340" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE5FF"/>
    </linearGradient>
    <linearGradient id="cyan" x1="48" y1="146" x2="124" y2="226" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20F0DE"/>
      <stop offset="1" stop-color="#00A9F5"/>
    </linearGradient>
    <linearGradient id="violet" x1="391" y1="247" x2="478" y2="335" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF22E6"/>
      <stop offset="1" stop-color="#7E21FF"/>
    </linearGradient>
  </defs>
  <rect x="38" y="142" width="88" height="88" rx="23" fill="url(#cyan)"/>
  <rect x="388" y="247" width="88" height="88" rx="23" fill="url(#violet)"/>
  <path d="M84 426 256 84 428 426" fill="none" stroke="url(#apex)" stroke-width="82" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M257 294 332 426" fill="none" stroke="url(#inner)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
